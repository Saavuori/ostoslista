# Local development stack. `docker compose up -d --build` (or podman-compose).
#
# The same file runs on the server; only the env values differ.

name: ostoslista

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ostoslista}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ostoslista}
      POSTGRES_DB: ${POSTGRES_DB:-ostoslista}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Exposed for drizzle-kit studio and psql from the host.
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ostoslista} -d ${POSTGRES_DB:-ostoslista}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ostoslista}:${POSTGRES_PASSWORD:-ostoslista}@db:5432/${POSTGRES_DB:-ostoslista}
      KRUOKA_DEFAULT_STORE: ${KRUOKA_DEFAULT_STORE:-N106}
      PRICE_TTL_SECONDS: ${PRICE_TTL_SECONDS:-21600}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  db-data:
