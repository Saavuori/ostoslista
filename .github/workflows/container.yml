name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required to attach build provenance to the published image.
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The server is arm64 (Oracle Ampere); developers are mostly amd64.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Runs the exact artefact that was just pushed, addressed by digest.
      # Reconstructing a tag here is guesswork, and was what broke this before.
      - name: Smoke-test the pushed image
        run: |
          # github.repository preserves the owner's casing (Saavuori/...), and
          # Docker rejects uppercase repository names. metadata-action
          # lowercases it for the push, so this has to match.
          REPO=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${REPO}@${{ steps.push.outputs.digest }}"
          echo "Testing $IMAGE"

          docker run -d --name smoke -p 3000:3000 \
            -e DATABASE_URL=postgres://unused:unused@127.0.0.1:5432/unused \
            "$IMAGE"

          # The health endpoint deliberately does not touch the database, so
          # this asserts that the server boots and serves, nothing more.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then
              echo "  -> healthy"
              docker rm -f smoke >/dev/null
              exit 0
            fi
            sleep 2
          done

          echo "container never became healthy"
          docker logs smoke
          docker rm -f smoke >/dev/null
          exit 1
